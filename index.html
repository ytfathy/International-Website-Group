<header class="top">

  <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false">☰</button>
  <nav id="nav" aria-label="Main">
    <a href="#/" data-r="home">Home</a>
    <a href="#/apps" data-r="apps">Apps &amp; Demos</a>

    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#6a3df0"/></linearGradient></defs>
    <ellipse cx="80" cy="184" rx="42" ry="6" fill="#0002"/>
    <path d="M42 182c0-34 16-54 38-54s38 20 38 54z" fill="url(#bd)"/>
    <circle cx="80" cy="150" r="9" fill="#ffd23f"/>
    <g class="arm"><path d="M114 140c14-6 24-22 20-38" stroke="#4f8cff" stroke-width="14" stroke-linecap="round" fill="none"/><circle cx="134" cy="98" r="10" fill="url(#sk)"/></g>
    <circle cx="80" cy="82" r="48" fill="url(#sk)"/>
    <circle cx="58" cy="96" r="8" fill="#ff8a7a" opacity=".5"/><circle cx="102" cy="96" r="8" fill="#ff8a7a" opacity=".5"/>

    <path d="M26 52 80 28l54 24-54 24z" fill="#1a3a8f"/><path d="M52 66v16q28 16 56 0V66l-28 12z" fill="#13296b"/>
    <path d="M134 52v26" stroke="#ffd23f" stroke-width="4"/><circle cx="134" cy="82" r="6" fill="#ffd23f"/>
  </svg>
  <button class="toggle" id="toggle" aria-label="Hide guide">✕</button>
</aside>
<div id="intro" role="dialog" aria-label="Welcome video">
  <video id="iv" src="assets/intro.mp4" poster="assets/intro-poster.jpg" playsinline muted autoplay preload="auto"></video>
  <div class="ic"><button id="isound" type="button">🔇 Sound on</button><button id="iskip" type="button">Skip ▶</button></div>
  <button id="iplay" type="button" hidden>▶ Tap to play</button>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
